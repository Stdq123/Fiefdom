  <g transform="translate(96 0)">
    <use href="#well" fill="#512b23"/>
    <use href="#well_face" fill="#341e19"/>
    <path fill="#231512" d="M6 5h36v2H6zM4 7h2v34H4z"/>
    <path fill="#6d3829" d="M6 43h36v2H6zm38-36h1v34h-1z"/>
    <path fill="#4c2a23" d="M8 39h2v2H8zm30 0h2v2h-2zM8 8h2v2H8zm30 0h2v2h-2z"/>
