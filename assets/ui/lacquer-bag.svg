  <!-- Occupied compartments have a warmer interior to reveal dark item sprites. -->
  <g transform="translate(144 0)">
    <use href="#well" fill="#241612"/>
    <path fill="#92503a" d="M5 2h38v2h3v40h-3v2H5v-2H2V4h3z"/>
    <use href="#well_face" fill="#624234"/>
