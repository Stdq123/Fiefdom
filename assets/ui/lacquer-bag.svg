    <path fill="#a66043" d="M6 44h36v1H6zm38-37h1v34h-1z"/>
    <path fill="#b47550" d="M8 8h2v2H8zm30 0h2v2h-2zM8 39h2v2H8zm30 0h2v2h-2z"/>
  </g>

  <!-- Bamboo stock labels, lashed down near the chamfered ends. -->
  <g transform="translate(192 0)">
    <use href="#bamboo_tag"/>
  </g>
  <g transform="translate(240 0)">
    <use href="#bamboo_tag"/>
    <path fill="#f0ce95" d="M10 7h28v31H10z"/>
    <path fill="#f7dca5" d="M11 8h17v1H11zm1 27h12v1H12z"/>
