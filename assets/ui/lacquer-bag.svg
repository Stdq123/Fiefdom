  <!-- Black lacquer with a red-painted linked border and stepped wooden joints. -->
  <g>
    <use href="#case" fill="#170f0d"/>
    <use href="#rim" fill="#3c251c"/>
    <path fill="#27201b" d="M8 7h32v2h2v30h-2v2H8v-2H6V9h2z"/>
    <use href="#shoulders" fill="#744537"/>
    <path fill="#9f5e43" d="M9 3h30v1H9zM3 9h1v30H3zM8 5h1v1H8zM5 8h1v1H5z"/>
    <path fill="#1c1410" d="M9 44h30v1H9zm35-35h1v30h-1z"/>
    <use href="#paint" fill="#97503c"/>
    <use href="#paint" fill="#9b4c37" transform="rotate(180 24 24)"/>
    <use href="#paint" fill="#784032" transform="rotate(90 24 24)"/>
    <use href="#paint" fill="#784032" transform="rotate(-90 24 24)"/>
    <use href="#wood_grain" fill="#32231c"/>
    <path fill="#ac7650" d="M8 7h2v2H8zm30 0h2v2h-2zM8 39h2v2H8zm30 0h2v2h-2z"/>
  </g>

  <!-- The oxblood liner and raised compartment walls. -->
  <g transform="translate(48 0)">
    <use href="#well" fill="#1a110e"/>
    <path fill="#5e3228" d="M5 2h38v2h3v40h-3v2H5v-2H2V4h3z"/>
